# Disposable stack: no host ports, lab networks, tenant volumes or Docker socket.
services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: integration-only
    # Throwaway test data: datadir in RAM and no crash durability, so local CI runs
    # do not write their databases to the workstation's SSD.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=0
      - --sync-binlog=0
    tmpfs:
      - /var/lib/mysql:rw,size=4g
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 30
    networks: [integration]
  redis:
    image: redis:6.2-alpine
    networks: [integration]
  tests:
    image: ${CRM_CI_IMAGE:?Set the full multi-app Muelle image}
    working_dir: /home/frappe/frappe-bench
    entrypoint: [bash, /candidate/scripts/ci/inside-container.sh]
    environment:
      CRM_CI_MODE: ${CRM_CI_MODE:-tests}
      CRM_CI_COVERAGE: ${CRM_CI_COVERAGE:-false}
      CRM_CI_MODULES: ${CRM_CI_MODULES:-}
    volumes:
      - ../..:/candidate:ro
      - ${CRM_CI_RESULTS_DIR:?Set the disposable artifact directory}:/results
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [integration]
networks:
  integration:
    internal: true
