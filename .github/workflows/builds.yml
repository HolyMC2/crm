name: CRM release CI
on:
  workflow_dispatch:
  push:
    branches: [main, main-hotfix, 'release/full-ci-*']
    tags: ['full-ci-*']
permissions:
  contents: read
  packages: read
concurrency:
  group: crm-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn test:run
        working-directory: frontend
      - run: yarn build
        working-directory: frontend
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require immutable representative image
        env:
          CRM_CI_IMAGE: ${{ vars.CRM_CI_IMAGE }}
        run: '[[ "$CRM_CI_IMAGE" =~ ^ghcr.io/holymc2/doco-bench@sha256:[a-f0-9]{64}$ ]]'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Native CRM tests with exact checked-out source
        env:
          CRM_CI_IMAGE: ${{ vars.CRM_CI_IMAGE }}
        run: scripts/ci/run-integration.sh
