name: CRM release CI
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: crm-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn test:run
        working-directory: frontend
      - run: yarn build
        working-directory: frontend
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-environment
        with:
          image: ${{ vars.CRM_CI_IMAGE }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Native CRM tests with exact checked-out source
        env:
          CRM_CI_IMAGE: ${{ vars.CRM_CI_IMAGE }}
        run: scripts/ci/run-integration.sh
