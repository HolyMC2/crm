name: Migration

# No doco-dev push trigger or nightly schedule: devflow `land` dispatches this workflow on the lane
# branch and requires it green on the exact sha it then fast-forwards doco-dev to; a push or
# nightly run would re-test a proven sha. Run it by hand with workflow_dispatch.
#
# Fast path (Shell SPEC §6.4 A6, docs/CI.md «Fast path»): `changes` skips the upgrade only when
# every changed path is frontend, docs or added translations; Python, hooks, patches, doctypes,
# fixtures and CI always migrate. The always-run «Migration gate» is the required check.
on:
    pull_request:
    workflow_dispatch:
        inputs:
            base_ref:
                description: Fork revision to install before upgrading to this workflow revision
                required: true
                default: doco-dev

permissions:
    contents: read
    packages: read

concurrency:
    group: migration-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Changed scope
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            server: ${{ steps.scope.outputs.server }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false
                  fetch-depth: 0
                  filter: blob:none
            - id: scope
              name: Classify the diff against the base
              env:
                  BASE: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'doco-dev' }}
              run: python3 scripts/ci/changed_scope.py --base "$BASE"

    upgrade:
        name: Upgrade base branch -> PR
        needs: changes
        if: needs.changes.outputs.server == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Checkout candidate
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false
            - name: Checkout actual fork base
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.repository }}
                  ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || github.event.before }}
                  path: .ci-base/crm
                  persist-credentials: false
            - name: Record immutable migration revisions
              run: |
                  git rev-parse HEAD
                  git -C .ci-base/crm rev-parse HEAD
                  test "$(git rev-parse HEAD)" != "$(git -C .ci-base/crm rev-parse HEAD)"
            - uses: ./.github/actions/setup-native-environment
              with:
                  image: ${{ vars.CRM_CI_IMAGE }}
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Install base, preserve records, migrate candidate and run all native tests
              env:
                  CRM_CI_IMAGE: ${{ vars.CRM_CI_IMAGE }}
                  CRM_CI_MODE: migration
              run: scripts/ci/run-integration.sh
            - name: Preserve complete migration evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: migration-evidence
                  path: .ci-results/
                  include-hidden-files: true
                  if-no-files-found: error

    gate:
        # The required check for this workflow; see server-tests.yml «Server gate».
        name: Migration gate
        needs: [changes, upgrade]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false
                  sparse-checkout: scripts/ci/gate.py
                  sparse-checkout-cone-mode: false
            - name: Every job this change needs succeeded
              run: >-
                  python3 scripts/ci/gate.py
                  "changes=${{ needs.changes.result }}"
                  "upgrade=${{ needs.upgrade.result }}:${{ needs.changes.outputs.server }}"
