name: Linters

on:
    pull_request:
    workflow_dispatch:
        inputs:
            base_ref:
                description: Git revision from which to check candidate commit titles
                required: true
                default: origin/doco-dev

permissions:
    contents: read
    pull-requests: read

jobs:
    commit-lint:
        name: Semantic Commits
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  check-latest: true

            - name: Install commitlint
              run: npm install --no-save @commitlint/cli @commitlint/config-conventional

            - name: Check commit titles
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  MANUAL_BASE: ${{ inputs.base_ref }}
              run: |
                  head=$(git rev-parse HEAD)
                  if [ -n "$PR_BASE" ]; then
                      base="$PR_BASE"
                  else
                      base=$(git merge-base "$MANUAL_BASE" "$head")
                      # Dispatch on the base branch still checks its latest commit.
                      if [ "$base" = "$head" ]; then
                          base=$(git rev-parse HEAD^)
                      fi
                  fi
                  git cat-file -e "$base^{commit}"
                  npx commitlint --verbose --from "$base" --to "$head"

    semgrep:
        name: Semgrep Rules
        runs-on: ubuntu-latest

        env:
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONDONTWRITEBYTECODE: "1"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip

            - name: Install Semgrep
              run: pip install --upgrade semgrep

            - name: Download Semgrep rules
              run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

            - name: Run Semgrep rules
              run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

    pre-commit:
        name: Pre-commit Checks
        runs-on: ubuntu-latest

        env:
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONDONTWRITEBYTECODE: "1"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install frontend dependencies
              run: cd frontend && yarn install

            - name: Run Pre-commit
              uses: pre-commit/action@v3.0.1
              with:
                  extra_args: --all-files
